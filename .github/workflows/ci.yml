name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-backend:
    name: Build & Verify .NET 8 Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend Solution
        run: dotnet restore QE170128_SE19B.NET_Ass1_BE/QE170128_SE19B.NET_Ass1_BE.sln

      - name: Build Backend Solution
        run: dotnet build QE170128_SE19B.NET_Ass1_BE/QE170128_SE19B.NET_Ass1_BE.sln --no-restore -c Release

  build-frontend:
    name: Build & Verify Next.js Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QE170128_SE19B.NET_Ass1_FE
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: QE170128_SE19B.NET_Ass1_FE/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint Next.js Application
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5066
